# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# See https://github.com/pre-commit/pre-commit-hooks fore more hooks as well


# List of
repos:

# Officially hosted hooks
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Use the ref you want to point at
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=4800']  # Limited to 2.5MB per file
    -   id: check-ast
    -   id: check-illegal-windows-names
    -   id: check-json
    -   id: check-symlinks
    -   id: check-toml
    -   id: check-xml
    -   id: check-yaml
        args: [--unsafe]
    -   id: debug-statements
    -   id: destroyed-symlinks
    -   id: detect-aws-credentials
        args: [--allow-missing-credentials]
    -   id: detect-private-key
    -   id: end-of-file-fixer
#    -   id: mixed-line-ending
#        args: [--fix=no]
#    -   id: no-commit-to-branch
#        args: [--branch, staging, --branch, main, --branch, master, --branch, main_snap]
    -   id: pretty-format-json
    -   id: requirements-txt-fixer
    -   id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

# Hook to detect and fix common misspellings in text files
-   repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
    -   id: codespell
        args: [ -w, -L, "THIRDPARTY" ]

# Linter + Code formatter written in Rust (ultra-high performance)
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.7.1
    hooks:
    # Run the linter.
    -   id: ruff
        name: ruff (linter)
        types_or: [ python, pyi ]
#        args: [ --fix , -v]
    -   id: ruff
        name: ruff (imports sorting)
        types_or: [ python, pyi ]
        args: [ check , --select, I, --fix ]
    # Run the formatter.
    -   id: ruff-format
        name: ruff (formatter)
#        args: [ -v ]
        types_or: [ python, pyi ]

