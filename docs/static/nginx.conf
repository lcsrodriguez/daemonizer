server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URls for MkDocs
    #location / {
    #    try_files \$uri \$uri/ /index.html;
    #}

    # Aggressive cache for static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Only logging for health checks
    access_log off;
}
