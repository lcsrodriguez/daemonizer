name: Linting

permissions:
  contents: read
  packages: read

on:
  push:
    paths:
      - src
      - tests
      - sandbox
  pull_request:
    paths:
      - src
      - tests
      - sandbox
  workflow_dispatch:


jobs:
  linting:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b
        with:
          version: 'latest'
          src: >-
            src/
            tests/
            sandbox/
          args: 'check --output-format=github .'

