[project]
name = "daemonizer"
version = "1.4.0"
description = "Lib to daemonize programs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.3",
    "distro>=1.9.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
docs = [
    "mkdocs-callouts>=1.16.0",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings-python>=2.0.3",
]

[tool.uv]
package = true
exclude-newer = "5 days"  # https://docs.astral.sh/uv/reference/settings/#exclude-newer

# CLI entry-point
[project.scripts]
daemonizer = "daemonizer.cli.commands:cli"
