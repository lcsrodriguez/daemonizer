[project]
name = "daemonizer"
version = "1.4.2"
description = "Library to define and manage daemonized Python-based programs in programmatic (SDK) or CLI-ready ways"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.3",
    "distro>=1.9.0",
    "psutil>=7.2.2",
]

authors = [
    {name = "Lucas RODRIGUEZ"}
]

# PyPi classifiers
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = ["daemons", "daemon", "daemonizer", "unix daemons", "processes"]

[project.urls]
Homepage = "https://github.com/lcsrodriguez/daemonizer"
Repository = "https://github.com/lcsrodriguez/daemonizer"
Documentation = "https://daemonizer.lucasrodriguez.net"
"Bug Tracker" = "https://github.com/lcsrodriguez/daemonizer/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
docs = [
    "mkdocs-callouts>=1.16.0",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings-python>=2.0.3",
]

[tool.uv]
package = true
exclude-newer = "5 days"  # https://docs.astral.sh/uv/reference/settings/#exclude-newer

# CLI entry-point
[project.scripts]
daemonizer = "daemonizer.cli.commands:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daemonizer"]
